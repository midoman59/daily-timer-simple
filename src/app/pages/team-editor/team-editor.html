<main class="page">
  <h1 class="page-title" tabindex="-1">Créer votre équipe</h1>

  <div class="card">
    <div class="field">
      <label class="field-label" for="team-name">Nom d'équipe</label>
      <input
        id="team-name"
        class="field-input"
        type="text"
        autocomplete="off"
        [formControl]="name"
        [attr.aria-invalid]="errorOf(name) ? 'true' : null"
        [attr.aria-describedby]="errorOf(name) ? 'team-name-error' : null"
      />
      @if (errorOf(name); as message) {
        <p id="team-name-error" class="field-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label class="field-label" for="duration">Durée de la Daily</label>
      <div class="field-suffix">
        <input
          id="duration"
          class="field-input"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          [formControl]="duration"
          [attr.aria-invalid]="errorOf(duration) ? 'true' : null"
          [attr.aria-describedby]="errorOf(duration) ? 'duration-error' : null"
        />
        <span class="field-unit" aria-hidden="true">min</span>
      </div>
      @if (errorOf(duration); as message) {
        <p id="duration-error" class="field-error">{{ message }}</p>
      }
    </div>

    <section class="field" aria-labelledby="members-heading">
      <h2 id="members-heading" class="section-label">Membres</h2>

      <div class="add-row">
        <div class="add-field">
          <label class="field-label" for="member-name">Prénom</label>
          <input
            id="member-name"
            #memberField
            class="field-input"
            type="text"
            autocomplete="off"
            [formControl]="memberName"
            (keydown.enter)="onMemberEnter($event)"
            [attr.aria-invalid]="memberError() ? 'true' : null"
            [attr.aria-describedby]="memberError() ? 'member-name-error' : null"
          />
          @if (memberError(); as message) {
            <p id="member-name-error" class="field-error">{{ message }}</p>
          }
        </div>
        <button type="button" class="btn btn-secondary" (click)="addMember()">Ajouter</button>
      </div>

      <ol class="member-list">
        @for (member of members(); track member) {
          <li class="member-row">
            <span class="member-order">{{ $index + 1 }}</span>
            <span class="member-name">{{ member }}</span>
          </li>
        }
      </ol>
    </section>
  </div>
</main>
